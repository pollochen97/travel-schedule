<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="2026/10/16～10/19 韓國旅程：銀赫見面會、藝聲演唱會、住宿、航班與每日行程。" />
  <title>崇家のKorea Trip</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <main class="site-shell">
    <section id="hero" class="hero" aria-labelledby="trip-title"></section>
    <section class="overview" aria-labelledby="overview-title">
      <div class="section-heading">
        <p class="eyebrow">Trip overview</p>
        <h2 id="overview-title">旅行資訊</h2>
      </div>
      <div id="overview-grid" class="overview-grid"></div>
      <details id="trip-notes" class="trip-notes" hidden>
        <summary class="trip-notes-title">旅行筆記</summary>
        <div id="reminders" class="reminders" aria-label="旅行筆記" hidden></div>
      </details>
    </section>
    <section class="itinerary" aria-labelledby="itinerary-title">
      <div class="section-heading">
        <p class="eyebrow">Itinerary</p>
        <h2 id="itinerary-title">每日行程</h2>
      </div>
      <div id="day-tabs" class="day-tabs" role="tablist" aria-label="每日行程"></div>
      <section id="day-panel" class="day-panel" role="tabpanel" tabindex="0"></section>
    </section>
    <footer id="footer" class="footer"></footer>
  </main>
  <script src="./tripData.js"></script>
  <script src="./app.js"></script>
</body>

</html>
